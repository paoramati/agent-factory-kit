<!doctype html>
<!-- Layout decision: command center; prioritize issues, then PRs, then supporting details. -->
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Factory dashboard</title>
  <style>
    :root {
      --bg: #fff;
      --fg: #1c1c1e;
      --mute: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --warn: #b45309;
      --bad: #b91c1c;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --fg: #e8e8ea;
        --mute: #9ca3af;
        --line: #2a2e37;
        --accent: #60a5fa;
        --warn: #fbbf24;
        --bad: #f87171;
        color-scheme: dark;
      }
    }
    body {
      margin: 0;
      padding: 1.5rem 1rem;
      background: var(--bg);
      color: var(--fg);
      font:
        14px/1.5 system-ui,
        sans-serif;
    }
    main {
      max-width: 72rem;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.3rem;
      margin: 0;
    }
    h2 {
      font-size: 1.05rem;
      margin: 2rem 0 0.2rem;
    }
    summary {
      cursor: pointer;
      font-weight: 600;
      margin: 0.9rem 0 0.3rem;
    }
    .mute {
      color: var(--mute);
      font-weight: 400;
    }
    a {
      color: var(--accent);
    }
    .wrap {
      overflow-x: auto;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th,
    td {
      text-align: left;
      padding: 0.3rem 0.55rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      color: var(--mute);
      font-weight: 500;
    }
    code {
      font-family: ui-monospace, monospace;
    }
    .tag {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 0.3rem;
      padding: 0 0.35rem;
      margin: 0 0.2rem 0.2rem 0;
      font-size: 12px;
      color: var(--mute);
    }
    .badge {
      display: inline-block;
      border-radius: 0.3rem;
      padding: 0 0.4rem;
      margin-left: 0.4rem;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--line);
      color: var(--mute);
    }
    .badge.stale {
      color: var(--warn);
      border-color: var(--warn);
    }
    .badge.unavailable {
      color: var(--bad);
      border-color: var(--bad);
    }
    .stale-body {
      opacity: 0.55;
    }
    #banner {
      display: none;
      margin: 0.8rem 0;
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--bad);
      border-radius: 0.3rem;
      color: var(--bad);
    }
    .eyebrow {
      color: var(--mute);
      font-size: 0.75rem;
      font-weight: 650;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .overview {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr));
      gap: 1rem;
      margin-top: 1.2rem;
    }
    .repo-card {
      border: 1px solid var(--line);
      border-radius: 0.75rem;
      padding: 1rem;
      min-width: 0;
    }
    .repo-card h2 {
      margin: 0;
      font-size: 1.05rem;
    }
    .card-head,
    .issue-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.7rem;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin: 1rem 0;
    }
    .metric {
      border-left: 2px solid var(--line);
      padding-left: 0.55rem;
    }
    .metric strong {
      display: block;
      font-size: 1.15rem;
    }
    .metric span,
    .small {
      color: var(--mute);
      font-size: 0.82rem;
    }
    .signals {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin: 0.6rem 0;
    }
    .signal {
      border: 1px solid var(--line);
      border-radius: 99px;
      padding: 0.12rem 0.5rem;
      color: var(--mute);
      font-size: 0.75rem;
    }
    .signal.warn {
      color: var(--warn);
      border-color: var(--warn);
    }
    .signal.bad {
      color: var(--bad);
      border-color: var(--bad);
    }
    .issue-list {
      display: grid;
      gap: 0.55rem;
      margin: 0.8rem 0;
      max-height: 22rem;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding-right: 0.4rem;
    }
    .issue {
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.55rem;
    }
    .issue:last-child {
      border-bottom: 0;
    }
  </style>
  <main>
    <h1>Factory dashboard</h1>
    <p class="mute" id="meta">Loading…</p>
    <div id="banner"></div>
    <div id="root"></div>
  </main>
  <script>
    const POLL_MS = 3000;
    const esc = (s) =>
      String(s ?? "").replace(
        /[&<>"']/g,
        (c) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          })[c],
      );
    const url = (u) => (/^https:\/\//.test(u) ? esc(u) : "#");
    const age = (s) =>
      s == null
        ? "never"
        : s < 60
          ? Math.round(s) + "s"
          : s < 3600
            ? Math.round(s / 60) + "m"
            : Math.round(s / 3600) + "h";
    const tag = (t) => `<span class="tag">${esc(t)}</span>`;
    // A commit time the way GitHub shows it: relative ("3 minutes ago"), full local timestamp on hover.
    const when = (iso) => {
      const t = Date.parse(iso);
      if (!iso || isNaN(t)) return esc(iso || "");
      const s = Math.max(0, (Date.now() - t) / 1000);
      const n = (v, unit) =>
        `${Math.floor(v)} ${unit}${Math.floor(v) === 1 ? "" : "s"} ago`;
      const rel =
        s < 45
          ? "just now"
          : s < 3600
            ? n(s / 60, "minute")
            : s < 86400
              ? n(s / 3600, "hour")
              : s < 2592000
                ? n(s / 86400, "day")
                : new Date(t).toLocaleDateString();
      return `<time datetime="${esc(iso)}" title="${esc(new Date(t).toLocaleString())} (${esc(iso)})">${esc(rel)}</time>`;
    };
    const table = (heads, rows) =>
      rows.length
        ? `<div class="wrap"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows
            .map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`)
            .join("")}</tbody></table></div>`
        : `<p class="mute">None.</p>`;

    // Keep details state across the three-second refresh.
    const detailState = new Map();
    document.addEventListener(
      "toggle",
      (e) => {
        const k = e.target.dataset && e.target.dataset.key;
        if (k) detailState.set(k, e.target.open);
      },
      true,
    );
    const isOpen = (key, defaultOpen = false) =>
      detailState.has(key) ? detailState.get(key) : defaultOpen;

    function badge(s) {
      if (!s) return "";
      if (s.status === "fresh")
        return `<span class="badge">${age(s.age)} ago</span>`;
      if (s.status === "stale")
        return `<span class="badge stale">stale, last good ${age(s.age)} ago: ${esc(s.error)}</span>`;
      return `<span class="badge unavailable">unavailable: ${esc(s.error)}</span>`;
    }

    // One collapsible block for a Source. body(data) renders only when there is data.
    function block(key, title, s, body, defaultOpen = false) {
      if (!s) return "";
      const inner =
        s.status === "unavailable"
          ? `<p class="mute">No data yet.</p>`
          : `<div class="${s.status === "stale" ? "stale-body" : ""}">${body(s.data)}</div>`;
      return `<details data-key="${esc(key)}"${isOpen(key, defaultOpen) ? " open" : ""}><summary>${title}${badge(s)}</summary>${inner}</details>`;
    }

    function issueFacts(r) {
      const source = r.sources.github;
      const issues = source?.data?.issues || [];
      const tickets = issues.filter((i) => !i.epic);
      const has = (i, label) => (i.labels || []).some((l) => l.name === label);
      const open = tickets.filter((i) => i.state === "OPEN");
      return {
        available: source?.data != null,
        all: tickets.length,
        done: tickets.filter((i) => i.state === "CLOSED").length,
        active: open.filter((i) => has(i, "in-progress")).length,
        human: open.filter((i) => has(i, "ready-for-human")).length,
        issues,
      };
    }

    function freshness(r) {
      return Object.entries(r.sources)
        .map(([name, s]) => {
          const label = name === "github" ? "GitHub" : name;
          if (s.status === "fresh")
            return `<span class="signal">${esc(label)} · ${age(s.age)} ago</span>`;
          if (s.status === "stale")
            return `<span class="signal warn">${esc(label)} · stale ${age(s.age)}</span>`;
          return `<span class="signal bad">${esc(label)} · unavailable</span>`;
        })
        .join("");
    }

    function issueList(r) {
      if (!r.sources.github?.data)
        return `<p class="small">${r.sources.github ? "GitHub data unavailable." : "GitHub not configured."}</p>`;
      const { issues } = issueFacts(r);
      const sorted = [...issues].sort(
        (a, b) =>
          Number(a.state !== "OPEN") - Number(b.state !== "OPEN") ||
          Number(a.epic) - Number(b.epic) ||
          a.number - b.number,
      );
      if (!sorted.length) return `<p class="small">No GitHub issues.</p>`;
      return `<div class="issue-list" data-scroll-key="issues-${esc(r.name)}">${sorted
        .map((i) => {
          const labels = (i.labels || []).map((l) => tag(l.name)).join(" ");
          return `<div class="issue"><div class="issue-head"><a href="${url(i.url)}" target="_blank" rel="noopener">#${esc(i.number)} ${esc(i.title)}</a><span class="small">${esc(i.state.toLowerCase())}${i.epic ? " · epic" : ""}</span></div>${labels}</div>`;
        })
        .join("")}</div>`;
    }

    function repoSignals(r) {
      const g = r.sources.git?.data;
      if (g?.missing) return `<span class="signal bad">repository path missing</span>`;
      if (!g) return `<span class="signal">Git unavailable</span>`;
      const state = g.state;
      return `<span class="signal">branch <code>${esc(r.branch)}</code></span><span class="signal${state.dirty ? " warn" : ""}">${state.dirty ? "working tree dirty" : "working tree clean"}</span><span class="signal${!["0", "no remote"].includes(state.unpushed) ? " warn" : ""}">${esc(state.unpushed)} unpushed</span>`;
    }

    function repoDetails(r) {
      const k = (name) => `${r.name}/${name}`;
      const g = r.sources.git;
      const gh = r.sources.github;
      const local = r.sources.tracker;
      return (
        block(k("prs"), "GitHub pull requests", gh, (d) =>
          table(
            ["#", "Title", "State", "Branch"],
            d.prs.map((p) => [
              `<a href="${url(p.url)}" target="_blank" rel="noopener">#${esc(p.number)}</a>`,
              esc(p.title),
              esc(p.state),
              `<code>${esc(p.headRefName)}</code>`,
            ]),
          ),
          true,
        ) +
        block(k("lprs"), "Local PRs · agent branches", g, (d) =>
          table(
            ["Branch", "State", "Ahead", "Last commit"],
            d.lprs.map((x) => [
              `<code>${esc(x.branch)}</code>`,
              x.merged ? "merged" : "open",
              esc(x.ahead),
              `${when(x.when)} ${esc(x.last)}`,
            ]),
          ),
        ) +
        block(k("merges"), "Recent merges", g, (d) =>
          d.state.merges.length
            ? "<ul>" +
              d.state.merges
                .map(
                  (m) =>
                    `<li>${when(m.split("|")[0])} ${esc(m.split("|").slice(1).join("|"))}</li>`,
                )
                .join("") +
              "</ul>"
            : `<p class="mute">None.</p>`,
        ) +
        (local
          ? block(k("tickets"), "Local tickets (beads)", local, (d) =>
              table(
                ["ID", "Title", "Status", "Priority"],
                d.map((i) => [
                  `<code>${esc(i.id)}</code>`,
                  esc(i.title),
                  esc(i.status),
                  "P" + esc(i.priority),
                ]),
              ),
            )
          : "")
      );
    }

    function commandCenter(st) {
      return `<div class="overview">${st.repos
        .map((r) => {
          const f = issueFacts(r);
          const g = r.sources.git?.data;
          const href = r.github
            ? url(`https://github.com/${r.github}`)
            : "";
          const link = (text) =>
            href
              ? `<a href="${href}" target="_blank" rel="noopener">${esc(text)}</a>`
              : esc(text);
          if (g?.missing)
            return `<article class="repo-card"><h2>${esc(r.name)}</h2><p class="small">Repository not found at ${esc(r.path)}</p></article>`;
          return `<article class="repo-card"><div class="card-head"><div><div class="eyebrow">${link(r.github || "Repository")}</div><h2>${link(r.name)}</h2></div><span class="small">${esc(r.branch)}</span></div><div class="metrics"><div class="metric"><strong>${f.available ? `${f.done}/${f.all}` : "—"}</strong><span>tickets done</span></div><div class="metric"><strong>${f.available ? f.active : "—"}</strong><span>active</span></div><div class="metric"><strong>${f.available ? f.human : "—"}</strong><span>needs human</span></div></div><div class="signals">${repoSignals(r)}</div><div class="signals">${freshness(r)}</div>${block(`${r.name}/issues`, "GitHub issue queue", r.sources.github, () => issueList(r), true)}${repoDetails(r)}</article>`;
        })
        .join("")}</div>`;
    }

    function render(st) {
      const y = window.scrollY;
      document.getElementById("meta").textContent =
        `Updated ${st.generated} · refreshes every ${POLL_MS / 1000}s · GitHub Issues are tickets; local agent branches are not GitHub PRs`;
      const root = document.getElementById("root");
      const scrollPositions = new Map(
        [...root.querySelectorAll("[data-scroll-key]")].map((e) => [
          e.dataset.scrollKey,
          e.scrollTop,
        ]),
      );
      root.innerHTML = commandCenter(st);
      for (const e of root.querySelectorAll("[data-scroll-key]"))
        e.scrollTop = scrollPositions.get(e.dataset.scrollKey) || 0;
      window.scrollTo(0, y);
    }

    async function poll() {
      const banner = document.getElementById("banner");
      try {
        const r = await fetch("/api/state", { cache: "no-store" });
        if (!r.ok) throw new Error("HTTP " + r.status);
        render(await r.json());
        banner.style.display = "none";
      } catch (e) {
        banner.textContent =
          "Dashboard server unreachable (" +
          e.message +
          "). Showing the last data received.";
        banner.style.display = "block";
      }
    }
    poll();
    setInterval(poll, POLL_MS);
  </script>
</html>
